name: flutter_demo
description: "This Flutter project its a demo for the class Mobile Programming "
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  shared_preferences: ^2.5.4
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.6.0
  just_audio: ^0.9.36
  audio_video_progress_bar: ^2.0.3
  audio_service: ^0.18.18


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
      - assets/audio/
